name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bootstrap-hash:
    # The install funnel's integrity ritual (README + script/get) tells a user to compare their
    # downloaded get.sh against the published script/get.sh.sha256. This job keeps that promise real:
    # it recomputes the hash and FAILS if the committed file drifted from script/get — a detection
    # gate that teaches the exact regeneration command. It NEVER commits or pushes (CI mutating the
    # repo would be its own footgun); fixing a mismatch is the author's one-liner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify script/get.sh.sha256 matches script/get
        run: |
          if [ ! -f script/get.sh.sha256 ]; then
            echo "script/get.sh.sha256 is missing — regenerate it:"
            echo "  shasum -a 256 script/get | awk '{print \$1\"  get.sh\"}' > script/get.sh.sha256"
            exit 1
          fi
          actual="$(shasum -a 256 script/get | awk '{print $1}')"
          published="$(awk '{print $1}' script/get.sh.sha256)"
          if [ "$actual" != "$published" ]; then
            echo "script/get.sh.sha256 is STALE (script/get changed but the hash wasn't updated)."
            echo "  published: $published"
            echo "  actual:    $actual"
            echo "regenerate and commit:"
            echo "  shasum -a 256 script/get | awk '{print \$1\"  get.sh\"}' > script/get.sh.sha256"
            exit 1
          fi
          echo "ok: script/get.sh.sha256 matches script/get ($actual)"

  offline-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: git identity (suites create temp repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ops-ci"
          git config --global init.defaultBranch main
      - name: run offline test suites
        run: |
          if [ -f test/run_all.py ]; then
            python3 test/run_all.py
          else
            echo "lean vault — no test harness, nothing to run"
          fi

  ui:
    # The TS terminal UI (ui/, ADR-011). Typecheck + compile smoke: the same `bun build --compile`
    # the release workflow ships must produce a binary that honors the non-TTY contract (exit 2,
    # pointing at `ops <verb> --json`) — that's testable headlessly without an ops vault.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install ui deps
        run: bun install --frozen-lockfile || bun install
        working-directory: ui
      - name: typecheck
        run: bunx tsc --noEmit
        working-directory: ui
      - name: compile smoke + non-TTY contract
        working-directory: ui
        run: |
          bun build --compile src/index.ts --outfile /tmp/ops-ui
          set +e
          out="$(/tmp/ops-ui </dev/null 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then
            echo "expected non-TTY exit 2, got $code"
            exit 1
          fi
