name: release-ui

# Ships the ops-ui terminal binary (ADR-011). Push a `ui-v*` tag and this cross-compiles ui/ into
# self-contained binaries (no Node/Bun needed on the user's machine) + a checksums.txt, attached to
# a GitHub release. Vaults install the matching asset via `ops setup ui --yes`, which downloads with
# the authenticated gh CLI (the template repo may be private) and verifies the sha256.
#
# Release ritual (from a clean, green main):
#   git tag ui-v0.1.0 && git push origin ui-v0.1.0

on:
  push:
    tags: ["ui-v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install ui deps
        run: bun install --frozen-lockfile || bun install
        working-directory: ui
      - name: typecheck
        run: bunx tsc --noEmit
        working-directory: ui
      - name: cross-compile binaries
        working-directory: ui
        run: |
          mkdir -p ../dist-bin
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build --compile --minify --target="bun-${target}" src/index.ts \
              --outfile "../dist-bin/ops-ui-${target}"
          done
      - name: checksums
        working-directory: dist-bin
        run: shasum -a 256 ops-ui-* > checksums.txt && cat checksums.txt
      - name: smoke (linux-x64 binary honors the non-TTY contract)
        run: |
          set +e
          out="$(./dist-bin/ops-ui-linux-x64 </dev/null 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then
            echo "expected non-TTY exit 2, got $code"
            exit 1
          fi
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-bin/* \
            --title "$GITHUB_REF_NAME" \
            --notes "ops-ui terminal binaries (self-contained; no Node required). Install into a vault with: ops setup ui --yes"
